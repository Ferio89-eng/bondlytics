name: Aggiorna dati pubblicati

on:
  schedule:
    # 16:30 CET, after the ECB reference is usually published. Weekdays only.
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
    inputs:
      bond_url:
        description: 'Link SimpleTools da aggiungere (vuoto = aggiorna solo i titoli già presenti e i cambi)'
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run export-data
        env:
          BOND_URLS: ${{ inputs.bond_url }}
      - name: Commit e push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/bonds.json public/data/fx.json
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Aggiorna obbligazioni e cambi pubblicati."
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Avvia il deploy di GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Publish GitHub Pages" --ref main
